name: Build Windows launcher

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file self-contained Windows x64
        run: >-
          dotnet publish Launcher/PungrangLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:MicrosoftClientId="${{ vars.MICROSOFT_CLIENT_ID }}"
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:DebugSymbols=false
          -p:DebugType=None
          -o publish

      - name: Verify EXE output
        shell: pwsh
        run: |
          $exe = Get-Item publish/PungrangLauncher.exe -ErrorAction Stop
          Write-Host "EXE size: $([math]::Round($exe.Length / 1MB, 2)) MB"
          $files = Get-ChildItem publish -File | Where-Object { $_.Name -ne "PungrangLauncher.exe" }
          if ($files.Count -gt 0) {
            Write-Error "Unexpected sidecar files found: $($files.Name -join ', ')"
            exit 1
          }
          Write-Host "Single EXE output confirmed."

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PungrangLauncher-win-x64-exe
          path: publish/PungrangLauncher.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: PungrangLauncher-win-x64-exe
          path: release

      - name: Publish EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/PungrangLauncher.exe
          generate_release_notes: true
